<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>

<script>
    document.getElementById('featuredGrid').innerHTML =
