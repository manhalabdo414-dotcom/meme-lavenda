<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - LAVENDA BEAUTY</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💄</text></svg>">
</head>
<body>
<div id="site-header"></div>

<main>
    <div class="form-box">
        <h2>مرحباً بكِ في عالم الجمال 💗</h2>
        <div id="alert"></div>

        <form onsubmit="login(event)">
            <input type="email" name="email" placeholder="البريد الإلكتروني" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button class="btn" type="submit">تسجيل الدخول</button>
        </form>

        <p class="form-link">
            ليس لديك حساب؟ <a href="register.html">أنشئي حساباً جديداً</a>
        </p>
    </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
    async function login(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
            await Auth.login(fd.get('email'), fd.get('password'));
            UI.toast('تم تسجيل الدخول بنجاح 💗', 'success');
            setTimeout(() => location.href = 'index.html', 500);
        } catch (err) {
            document.getElementById('alert').innerHTML =
                `<div class="alert error">${escapeHtml(err.message)}</div>`;
        }
    }
</script>
</body>
</html>
